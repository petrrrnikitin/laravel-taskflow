x-backend-volume: &backend_volume "./backend:/var/www"

x-php-base: &php_base
  restart: unless-stopped
  working_dir: /var/www
  build:
    context: ./backend
    dockerfile: ../docker/php/Dockerfile
  environment:
    - APP_KEY
    - APP_ENV
    - APP_DEBUG
    - APP_URL
    - FRONTEND_URL
    - DB_CONNECTION
    - DB_HOST
    - DB_PORT
    - DB_DATABASE
    - DB_USERNAME
    - DB_PASSWORD
    - REDIS_HOST
    - REDIS_PORT
    - QUEUE_CONNECTION
    - CACHE_STORE
  volumes:
    - *backend_volume
  depends_on:
    - postgres
    - redis
  networks:
    - taskflow

x-php-worker: &php_worker
  <<: *php_base
  restart: unless-stopped

services:
  app:
    <<: *php_base
    container_name: taskflow_app

  nginx:
    image: nginx:alpine
    container_name: taskflow_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - *backend_volume
      - "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf"
    depends_on:
      - app
    networks:
      - taskflow

  postgres:
    image: postgres:16-alpine
    container_name: taskflow_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taskflow

  redis:
    image: redis:alpine
    container_name: taskflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taskflow

  queue:
    <<: *php_worker
    container_name: taskflow_queue
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90

networks:
  taskflow:
    driver: bridge

volumes:
  postgres_data:
  redis_data: